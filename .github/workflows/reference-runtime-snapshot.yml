name: reference-runtime-snapshot
on:
  push:
    branches: [refactor/reference-runtime-minimal]
    paths: [.github/workflows/reference-runtime-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'simota/agent-skills' && github.ref == 'refs/heads/refactor/reference-runtime-minimal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked baseline and history
        shell: bash
        run: |
          set -euo pipefail
          baseline=c805268f112a735214d5af28dc327561ac1e999d
          test "$(git rev-parse "$baseline^{tree}")" = 6961ec286f54a5878dc78948c72b8629ef06f8db
          git archive --format=tar "$baseline" | gzip -n > "$RUNNER_TEMP/runtime-baseline.tar.gz"
          git cat-file commit "$baseline" > "$RUNNER_TEMP/runtime-baseline.commit"
          git log "$baseline" --format='COMMIT %H %aI' --name-only > "$RUNNER_TEMP/runtime-history.txt"
          git ls-tree -r "$baseline" > "$RUNNER_TEMP/runtime-baseline-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-baseline
          path: |
            ${{ runner.temp }}/runtime-baseline.tar.gz
            ${{ runner.temp }}/runtime-baseline.commit
            ${{ runner.temp }}/runtime-history.txt
            ${{ runner.temp }}/runtime-baseline-tree.txt
          retention-days: 7
          if-no-files-found: error
