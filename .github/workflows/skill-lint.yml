name: skill-lint

# The checks cover references, symlinks, JSON fixtures, and catalog assets as well
# as Markdown. An extension-specific path filter can silently miss regressions.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-frontmatter:
    name: Corpus validation and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install checker dependencies
        run: python3 -m pip install -r requirements-checks.txt

      - name: Run all blocking checks and regression tests
        # A clean CI checkout has no working-tree diff. Full validation catches
        # committed changes and keeps CI identical to the local check target.
        run: make check

      - name: Contract delivery matrix
        run: python3 _common/scripts/lint-contracts.py --report
