name: skill-lint

on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - '_common/scripts/lint-frontmatter.py'
      - '_common/scripts/validate-recipes.py'
      - '_common/scripts/routing-oracle.py'
      - '_common/scripts/lint-instructions.py'
      - '_common/scripts/lint-contracts.py'
      - '_common/**.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/skill-lint.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-frontmatter:
    name: Frontmatter / structure / size lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD~1 for --changed-only on PRs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint all SKILL.md (warning baseline)
        # Always run a full scan for visibility. Severity: warning => exit 0.
        # This surfaces the ecosystem-wide state without blocking merges on legacy issues.
        run: python3 _common/scripts/lint-frontmatter.py --severity warning

      - name: Lint changed SKILL.md (hard fail on P0/P1)
        # Block merges that introduce or worsen P0/P1 findings in changed files.
        # PR-only: pushes to main already passed this gate.
        if: github.event_name == 'pull_request'
        run: python3 _common/scripts/lint-frontmatter.py --severity error --changed-only

      - name: Validate Recipes/Subcommand Dispatch (warning baseline)
        run: python3 _common/scripts/validate-recipes.py --severity warning

      - name: Validate Recipes/Subcommand Dispatch (changed-only hard fail)
        if: github.event_name == 'pull_request'
        run: python3 _common/scripts/validate-recipes.py --severity error --changed-only

      - name: Routing Oracle (dead-refs, ladder order, producer!=verifier)
        # Fail-open by design (routing-oracle.py catches its own exceptions and
        # exits 0 with a warning) — a bug in this checker must never block an
        # unrelated PR. Full-repo scan every run: routing structural invariants
        # are global (nexus/ classify flow + chain tables), not per-changed-file.
        run: python3 _common/scripts/routing-oracle.py --severity error

      - name: Lint instruction files (skill-count drift, dead paths, rule duplication)
        # AGENTS.md / CLAUDE.md drift is invisible to the SKILL.md-scoped checks above:
        # a roster change updates skills but leaves the instruction files asserting the
        # old count. Full-repo scan every run — the roster is a global invariant.
        run: python3 _common/scripts/lint-instructions.py --severity error

      - name: Lint contract delivery (spine reachability, symlink wiring, orphan contracts)
        # Whether a contract *can* reach a running agent is a property of the whole
        # document graph, so this is a full-repo scan: adding a spine contract or
        # dropping one naming of it changes reachability for skills the PR never
        # touched. Every spine contract reaches all 90 skills directly today, so both
        # unreachable and indirect (depth 2+) delivery block — the baseline is clean
        # and any drop off it is a regression.
        run: python3 _common/scripts/lint-contracts.py --severity error

      - name: Contract delivery matrix
        # Never fails. Prints the depth table so a reachability regression is legible
        # in the log even when it stays under the blocking threshold.
        run: python3 _common/scripts/lint-contracts.py --report
