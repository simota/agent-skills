name: reference-runtime-apply
on:
  push:
    branches: [refactor/reference-runtime-minimal]
    paths: [.github/workflows/reference-runtime-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'simota/agent-skills' && github.ref == 'refs/heads/refactor/reference-runtime-minimal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install existing checker dependencies
        run: python3 -m pip install -r requirements-checks.txt
      - name: Apply exact reviewed content and remove transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          baseline = 'c805268f112a735214d5af28dc327561ac1e999d'
          expected_tree = '93d02614fe28aa7b14ed52f1a08fb6d7ecc2be4c'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', baseline + '^{tree}') == '6961ec286f54a5878dc78948c72b8629ef06f8db'
          expected = [
              'd4c3fd0288ba6c500bbb75d22673f83bff6ba630ecae5c7b7fe76392cd537dda',
              '849b37439780b983ee58fa256dbb35563f5e789e5557fb245e1991dbbb15589f',
              '505cea24b9eeed05b7e89f898e73d6fbc6fdae0706aff87fc4472a4440d19f09',
              '5b395a91d826a5e096a6c8a94e77224d54982295fab7a9e443d78c1924ea94af',
              'a36edee54f9bf7550528dea796584a1645f2a602507468d5bcf1fbcbbd7fb378',
              '0b85a47246fe80fad699b4fe50db3a7374b0b539b1019fc7fb4e67d2bd8a116a',
              'a471368ff0c4920897b4d908923e79070e9bfc570d1a730208a3d034881b0680',
              'ad848b7e36bc2b9ace6e4b8b1db9d452ef1b056cc2d3d3e78e50e6c945c8aadd',
          ]
          chunks = [pathlib.Path(f'.github/reference-runtime-data-{i:02}.b64') for i in range(8)]
          for path, digest in zip(chunks, expected):
              actual = sha(path.read_bytes())
              assert actual == digest, f'Transport mismatch: {path}: {actual}'
          encoded = ''.join(p.read_text().strip() for p in chunks)
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert sha(raw) == '5cb3b4ca88de7d93779ac45d13ec22d9d5312d79f763c339dda30bfeac8ed6f6'
          manifest = json.loads(raw)
          assert manifest['baseline'] == baseline
          entries = manifest['entries']
          assert len(entries) == 142 and len({e['path'] for e in entries}) == 142
          for e in entries:
              p = pathlib.Path(e['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.name == 'SKILL.md' or 'reference' in p.parts
              assert not p.is_symlink() and not any(a.is_symlink() for a in p.parents)
              old = p.read_bytes() if p.exists() else None
              assert (sha(old) if old is not None else None) == e['old'], str(p)
              if e['new'] is None:
                  p.unlink()
                  continue
              lines = old.decode('utf-8').splitlines(keepends=True) if old is not None else []
              result, cursor = [], 0
              for start, stop, replacement in e['ops']:
                  assert cursor <= start <= stop <= len(lines), str(p)
                  result.extend(lines[cursor:start])
                  result.append(replacement)
                  cursor = stop
              result.extend(lines[cursor:])
              data = ''.join(result).encode('utf-8')
              assert sha(data) == e['new'], str(p)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          temporary = chunks + [pathlib.Path('.github/workflows/reference-runtime-snapshot.yml'), pathlib.Path('.github/workflows/reference-runtime-apply.yml')]
          for p in temporary:
              p.unlink()
          subprocess.run(['git', 'add', '-A', '--', *[e['path'] for e in entries], *map(str, temporary)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          assert tree == expected_tree, f'Final tree mismatch: {tree}'
          evidence = {'baseline': baseline, 'tree': tree, 'files_verified': len(entries), 'manifest_sha256': sha(raw)}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'runtime-apply-verification.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Run every existing check and contract report
        shell: bash
        run: |
          set -euo pipefail
          make hooks
          make check 2>&1 | tee "$RUNNER_TEMP/runtime-make-check.log"
          python3 _common/scripts/lint-contracts.py --report 2>&1 | tee "$RUNNER_TEMP/runtime-contract-report.log"
      - name: Commit through existing hook and push reviewed branch
        shell: bash
        run: |
          set -euo pipefail
          branch=refactor/reference-runtime-minimal
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = 93d02614fe28aa7b14ed52f1a08fb6d7ecc2be4c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: condense runtime references' -m 'Remove duplicated supporting documentation, consolidate related decision tables, and retain skill-specific schemas and safety gates. This change is a partial semantic audit, not a claim of complete corpus minimization.' 2>&1 | tee "$RUNNER_TEMP/runtime-commit-hook.log"
          test "$(git rev-parse HEAD^{tree})" = 93d02614fe28aa7b14ed52f1a08fb6d7ecc2be4c
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/runtime-final-identity.txt"
          git diff --binary c805268f112a735214d5af28dc327561ac1e999d HEAD > "$RUNNER_TEMP/runtime-reference.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-reference-validation
          path: |
            ${{ runner.temp }}/runtime-apply-verification.json
            ${{ runner.temp }}/runtime-make-check.log
            ${{ runner.temp }}/runtime-contract-report.log
            ${{ runner.temp }}/runtime-commit-hook.log
            ${{ runner.temp }}/runtime-final-identity.txt
            ${{ runner.temp }}/runtime-reference.patch
          retention-days: 7
          if-no-files-found: warn
